name: Docs

on:
  push:
    tags:
      # Sync docs on stable releases only, not on every commit to main.
      - 'v*'
      - '!v*dev*'
  workflow_dispatch:

jobs:
  trigger-docs-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger public-docs workflow
        if: "${{ env.DOCS_SYNC_PAT != '' }}"
        env:
          DOCS_SYNC_PAT: ${{ secrets.DOCS_SYNC_PAT }}
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.DOCS_SYNC_PAT }}
          repository: Yugpatel-09/public-docs
          event-type: docs-updated
          client-payload: '{"repo": "EnvForge", "ref": "${{ github.sha }}"}'


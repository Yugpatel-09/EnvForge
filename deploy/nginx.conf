server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 256k;
    location /v1/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }
    location /health { proxy_pass http://api:8000; }
    location / { try_files $uri $uri/ /index.html; }
}
